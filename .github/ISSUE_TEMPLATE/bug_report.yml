name: Bug report
description: Something in SURL does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do **not** use this form for security
        issues — see [SECURITY.md](https://github.com/sorrysvj/surl/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what did SURL do instead?
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: The exact command
      description: >
        Please include the full command line. Redact any credentials passed
        with --header or --cookie.
      render: shell
      placeholder: surl https://example.com -d ./website --recursive
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: URL
      description: >
        A public URL that reproduces the problem, if you can share one. This is
        by far the most useful thing you can provide.

  - type: textarea
    id: output
    attributes:
      label: Output
      description: Re-run with `--debug` and paste the relevant output.
      render: shell

  - type: input
    id: version
    attributes:
      label: SURL version
      description: Output of `surl --version -v`
      placeholder: surl 1.0.0
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: How did you install SURL?
      options:
        - Windows installer
        - Portable ZIP
        - Built from source
        - Other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2 / Ubuntu 24.04 / macOS 15
    validations:
      required: true
