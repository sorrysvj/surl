name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.0.0). Leave empty to use the current ref.'
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Minimal by default; only the publish job is allowed to write.
permissions:
  contents: read

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve and check the version
        id: version
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          FILE_VERSION="$(tr -d '[:space:]' < VERSION.txt)"

          echo "tag=$TAG"          >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"  >> "$GITHUB_OUTPUT"

          echo "tag:         $TAG"
          echo "VERSION.txt: $FILE_VERSION"

          # The tag is the trigger, but VERSION.txt is the source of truth that
          # the binary, installer and manifest all read. They must agree.
          if [ "$VERSION" != "$FILE_VERSION" ]; then
            echo "::error::Tag $TAG does not match VERSION.txt ($FILE_VERSION). Update VERSION.txt and re-tag."
            exit 1
          fi

  windows:
    name: Build Windows x64 release
    runs-on: windows-2022
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Inno Setup
        shell: pwsh
        run: ./scripts/install-innosetup.ps1

      - name: Configure
        run: cmake --preset windows-release -DSURL_WERROR=ON

      - name: Build
        run: cmake --build --preset windows-release --parallel

      - name: Test
        run: ctest --preset windows-release

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -BuildDir build/windows-release

      - name: Verify checksums
        shell: pwsh
        run: ./scripts/checksum.ps1 -Verify

      - name: Install, verify and uninstall
        shell: pwsh
        run: ./scripts/test-installer.ps1

      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: assets-windows
          path: dist/*
          if-no-files-found: error

  unix:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            os: ubuntu-latest
            preset: linux-release
            asset: surl-linux-x64.tar.gz
          - label: macOS arm64
            os: macos-latest
            preset: macos-release
            asset: surl-macos-arm64.tar.gz
          - label: macOS x64
            os: macos-13
            preset: macos-release
            asset: surl-macos-x64.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libcurl4-openssl-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Package
        run: |
          mkdir -p dist stage
          cp "build/${{ matrix.preset }}/surl" stage/
          cp LICENSE stage/
          cp README.md stage/
          tar -czf "dist/${{ matrix.asset }}" -C stage .
          ls -l dist

      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.preset }}-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish the GitHub release
    runs-on: ubuntu-latest
    needs: [verify, windows, unix]
    # The only job that may write to the repository, and only what a release
    # needs.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download every built asset
        uses: actions/download-artifact@v4
        with:
          path: staging

      - name: Collect assets
        run: |
          mkdir -p dist
          # Flatten the per-job artifact directories, dropping the per-job
          # checksum files: a single authoritative one is generated below.
          find staging -type f ! -name 'checksums.txt' -exec cp {} dist/ \;
          ls -l dist

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Build the release notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          {
            echo "# SURL v${VERSION}"
            echo
            echo "Fast native C++ website mirroring CLI."
            echo
            echo '```bash'
            echo "surl https://example.com -d ./website"
            echo '```'
            echo
            echo "## Installation"
            echo
            echo "**Windows installer** — download \`surl-windows-x64-installer.exe\`, run it,"
            echo "pick your language and installation scope, and leave *Add SURL to PATH* enabled."
            echo "Then open a new terminal and run \`surl --version\`."
            echo
            echo "**Portable** — download \`surl-windows-x64-portable.zip\`, extract it anywhere"
            echo "and run \`surl.exe --help\`. It installs nothing and changes no settings."
            echo
            echo "**Linux / macOS** — download the matching \`.tar.gz\`, extract it, and put"
            echo "\`surl\` somewhere on your PATH."
            echo
            echo "## Verifying your download"
            echo
            echo "All assets are listed in \`checksums.txt\` (SHA-256):"
            echo
            echo '```powershell'
            echo '(Get-FileHash .\surl-windows-x64-installer.exe -Algorithm SHA256).Hash'
            echo '```'
            echo
            echo "## Assets"
            echo
            cd dist
            for f in *; do
              [ "$f" = "checksums.txt" ] && continue
              printf -- "- \`%s\` (%s)\n" "$f" "$(du -h "$f" | cut -f1)"
            done
            cd ..
            echo
            echo "---"
            echo
            echo "Full changelog: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/v${VERSION}/CHANGELOG.md)"
          } > release-notes.md
          cat release-notes.md

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: SURL ${{ needs.verify.outputs.tag }}
          body_path: release-notes.md
          files: dist/*
          draft: false
          prerelease: ${{ contains(needs.verify.outputs.version, '-') }}
          fail_on_unmatched_files: true
